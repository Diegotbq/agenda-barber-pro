<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Barber Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:white;font-family:Arial,sans-serif}
header{background:#171c28;padding:25px;text-align:center;border-bottom:2px solid #d5a33b}
h1{color:#e6b84e;margin:0}
main{max-width:650px;margin:35px auto;padding:20px}
.card{background:#1c2331;padding:22px;border-radius:14px;margin-bottom:20px}
input,select,button{width:100%;padding:14px;margin:8px 0;border-radius:8px;border:0;font-size:16px}
button{background:#d5a33b;color:#171717;font-weight:bold;cursor:pointer}
p{color:#c8ced8}
</style>
</head>
<body>
<header>
<h1>✂️ Agenda Barber Pro</h1>
<p>Seu estilo, seu horário!</p>
</header>
<main>
<div class="card">
<h2>Encontre seu estabelecimento</h2>
<p>Em breve você poderá escolher seu estabelecimento e agendar seu horário.</p>
</div>
<div class="card">
<h2>Área do profissional</h2>
<p>Cadastre seu estabelecimento e gerencie seus serviços e horários.</p>
<button onclick="alert('Vamos conectar sua área administrativa ao sistema!')">Acessar área profissional</button>
</div>
</main>
</body>
</html>
